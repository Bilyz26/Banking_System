spring:
  autoconfigure:
    exclude: []
  datasource:
    url: ${BANKING_DB_URL:jdbc:postgresql://localhost:5432/banking}
    username: ${BANKING_DB_USERNAME:banking}
    password: ${BANKING_DB_PASSWORD:banking}
    hikari:
      maximum-pool-size: ${BANKING_DB_POOL_SIZE:10}
  flyway:
    enabled: true
    locations: classpath:db/migration
