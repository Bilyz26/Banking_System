name: Frontend Release

on:
  push:
    tags:
      - "frontend-v*"

permissions:
  contents: write

jobs:
  release:
    name: Verify and publish frontend
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Verify tag matches package version
        shell: bash
        run: |
          package_version="$(node -p "require('./package.json').version")"
          tag_version="${GITHUB_REF_NAME#frontend-v}"
          test "$package_version" = "$tag_version"

      - name: Install locked dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Verify frontend
        run: npm run verify

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser tests
        run: npm run test:e2e

      - name: Build runtime container
        working-directory: .
        run: docker build --tag banking-frontend:${{ github.ref_name }} frontend

      - name: Package immutable assets
        shell: bash
        run: |
          tar -C dist -czf "banking-frontend-${GITHUB_REF_NAME}.tar.gz" .
          sha256sum "banking-frontend-${GITHUB_REF_NAME}.tar.gz" \
            > "banking-frontend-${GITHUB_REF_NAME}.sha256"

      - name: Publish GitHub release
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            "frontend/banking-frontend-${{ github.ref_name }}.tar.gz" \
            "frontend/banking-frontend-${{ github.ref_name }}.sha256" \
            --repo "${{ github.repository }}" \
            --title "Banking System Frontend ${{ github.ref_name }}" \
            --notes-file frontend/RELEASE_NOTES.md \
            --verify-tag
