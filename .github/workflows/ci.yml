name: Continuous Integration

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify Java 21 build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Verify
        run: ./mvnw --batch-mode --no-transfer-progress clean verify

      - name: Upload executable JAR
        uses: actions/upload-artifact@v4
        with:
          name: banking-system-${{ github.sha }}
          path: target/banking-system-*.jar
          if-no-files-found: error
          retention-days: 7

      - name: Upload OpenAPI contract
        uses: actions/upload-artifact@v4
        with:
          name: banking-system-openapi-${{ github.sha }}
          path: docs/openapi/banking-api.json
          if-no-files-found: error
          retention-days: 7

  container:
    name: Build container image
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Build image
        run: docker build --tag banking-system:${{ github.sha }} .
