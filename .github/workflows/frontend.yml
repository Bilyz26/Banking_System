name: Frontend Continuous Integration

on:
  push:
    branches:
      - main
    paths:
      - "frontend/**"
      - "deployment/keycloak/banking-realm.json"
      - "compose.yml"
      - ".github/workflows/frontend.yml"
  pull_request:
    paths:
      - "frontend/**"
      - "deployment/keycloak/banking-realm.json"
      - "compose.yml"
      - ".github/workflows/frontend.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: frontend

jobs:
  verify:
    name: Static analysis, tests, and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Verify formatting, types, tests, accessibility, and build
        run: npm run verify

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-coverage-${{ github.sha }}
          path: frontend/coverage
          if-no-files-found: warn
          retention-days: 7

      - name: Upload production bundle
        uses: actions/upload-artifact@v7
        with:
          name: frontend-dist-${{ github.sha }}
          path: frontend/dist
          if-no-files-found: error
          retention-days: 7

  browser:
    name: Browser smoke tests
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-playwright-${{ github.sha }}
          path: frontend/playwright-report
          if-no-files-found: warn
          retention-days: 7

  container:
    name: Build frontend container
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 15
    defaults:
      run:
        working-directory: .

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Build image
        run: docker build --tag banking-frontend:${{ github.sha }} frontend

      - name: Validate Compose configuration
        run: docker compose config --quiet
